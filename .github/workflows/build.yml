name: Construire l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: gradle :app:assembleRelease --no-daemon
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk CarnetLeonida.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CarnetLeonida
          path: CarnetLeonida.apk
      - name: Publier une release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Carnet de Leonida ${{ github.run_number }}
          files: CarnetLeonida.apk
