plugins { id 'com.android.application' }

android {
    namespace 'fr.maxence.leonida'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.maxence.leonida'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // Clé fixe : les mises à jour s'installent par-dessus sans perdre la progression
        perso {
            storeFile file('leonida.jks')
            storePassword 'leonida2026'
            keyAlias 'leonida'
            keyPassword 'leonida2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.perso
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
